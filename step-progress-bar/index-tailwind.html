<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta2/css/all.min.css"
      integrity="sha512-YWzhKL2whUzgiheMoBFwW8CKV4qpHQAEuvilg9FAn5VJUDwKZZxkJNuGM4XkWuk94WCrrwslk8yWNGmY1EduTA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        .step{
            @apply w-[30px] h-[30px] bg-white rounded-full flex justify-center items-center border-4 border-solid border-gray-300 text-gray-300
        }

        .step.checked {
            @apply text-green-500 border-green-700 transition-all duration-500 ease-linear delay-300
        }

        .step.checked small {
            @apply absolute -bottom-8 font-[Courier] text-green-700
        }

        .btn {
            @apply bg-[rgb(82,72,150)] border-none text-white px-6 py-2 mx-2 mt-16 mb-0 rounded-xl cursor-pointer shadow-[0_4px_8px_rgba(0,0,0,0.3)] hover:opacity-70 
        }
    </style>
    <title>Step Progress Bar</title>
  </head>
  <body class="flex justify-center items-center h-screen bg-[rgb(200,182,235)]">
    <div class="text-center container">
      <div class="relative left-1/3 w-[500px] flex justify-between md:max-w-[90vw] progress-container">
        
        <hr class="absolute h-[4px] w-full bg-[lightgray] border-none -z-10 m-0 top-1/2 -translate-y-1/2 progress-bar-back" />
        
        <hr class="absolute h-[4px] w-0 bg-green-700 border-none -z-10 m-0 top-1/2 -translate-y-1/2 transition-[width] duration-500 ease-linear progress-bar-front" />

        <div class="step checked">
          <i class="fas fa-check"></i>
          <small>Start</small>
        </div>

        <div class="step">
          <i class="fas fa-times"></i>
        </div>

        <div class="step">
          <i class="fas fa-times"></i>
        </div>

        <div class="step">
          <i class="fas fa-times"></i>
        </div>

        <div class="step">
          <i class="fas fa-times"></i>
        </div>
      </div>

      <button class="btn active:scale-95 disabled:bg-gray-300" id="prev" disabled>
        <i class="fas fa-arrow-left"></i>
      </button>

      <button class="btn active:scale-95 disabled:bg-gray-300" id="next">
        <i class="fas fa-arrow-right"></i>
      </button>

    </div>

    <script src="index.js"></script>
  </body>
</html>
