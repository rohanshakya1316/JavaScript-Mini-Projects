<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />

    <title>Rohan Man Shakya</title>
  </head>

  <body class="bg-[#d4c7c7] font-mono">
    <!-- Hamburger -->
    <i
      class="fa fa-bars fixed top-8 right-12 text-2xl text-[#222121] cursor-pointer hover:text-fuchsia-500 transition-all duration-300"
      id="bars"
    ></i>

    <!-- Sidebar -->
    <div
      id="sidebar"
      class="fixed top-0 left-0 w-full h-full bg-white -translate-x-full transition-transform duration-300"
    >
      <!-- Sidebar Header -->
      <div class="flex items-center justify-between px-6 py-4">
        <img
          src="Rohan Shakya(LOGO).png"
          alt="Logo of Rohan Shakya"
          class="w-[100px] ml-[-15px]"
        />

        <i
          class="fa fa-times text-2xl text-fuchsia-500 cursor-pointer hover:text-black transition-all duration-300"
          id="closeBtn"
        ></i>
      </div>

      <!-- Menu -->
      <ul>
        <li>
          <a
            href="#"
            class="block text-2xl text-gray-500 px-6 py-4 hover:bg-[#f76363] hover:text-white hover:pl-7 transition-all duration-300"
          >
            Home
          </a>
        </li>

        <li>
          <a
            href="#"
            class="block text-2xl text-gray-500 px-6 py-4 hover:bg-[#f76363] hover:text-white hover:pl-7 transition-all duration-300"
          >
            Contact Me
          </a>
        </li>

        <li>
          <a
            href="#"
            class="block text-2xl text-gray-500 px-6 py-4 hover:bg-[#f76363] hover:text-white hover:pl-7 transition-all duration-300"
          >
            Projects
          </a>
        </li>
      </ul>
    </div>

    <script src="index-tailwind.js"></script>
  </body>
</html>
