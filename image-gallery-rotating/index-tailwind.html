<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <title>3D Rotating Image Gallery</title>
  </head>

  <body
    class="m-0 flex h-screen flex-col items-center justify-center overflow-hidden bg-black text-center"
  >
    <!-- Gallery -->
    <div
      id="gallery"
      class="relative h-[200px] w-[200px] [transform-style:preserve-3d]"
      style="transform: perspective(1000px) rotateY(0deg)"
    >
      <span
        class="absolute inset-0"
        style="transform: rotateY(calc(1 * 45deg)) translateZ(400px)"
      >
        <img
          src="https://picsum.photos/id/237/300/200"
          class="absolute inset-0 h-full w-full rounded-xl object-cover"
        />
      </span>

      <span
        class="absolute inset-0"
        style="transform: rotateY(calc(2 * 45deg)) translateZ(400px)"
      >
        <img
          src="https://picsum.photos/id/23/300/200"
          class="absolute inset-0 h-full w-full rounded-xl object-cover"
        />
      </span>

      <span
        class="absolute inset-0"
        style="transform: rotateY(calc(3 * 45deg)) translateZ(400px)"
      >
        <img
          src="https://picsum.photos/id/48/300/200"
          class="absolute inset-0 h-full w-full rounded-xl object-cover"
        />
      </span>

      <span
        class="absolute inset-0"
        style="transform: rotateY(calc(4 * 45deg)) translateZ(400px)"
      >
        <img
          src="https://picsum.photos/id/12/300/200"
          class="absolute inset-0 h-full w-full rounded-xl object-cover"
        />
      </span>

      <span
        class="absolute inset-0"
        style="transform: rotateY(calc(5 * 45deg)) translateZ(400px)"
      >
        <img
          src="https://picsum.photos/id/59/300/200"
          class="absolute inset-0 h-full w-full rounded-xl object-cover"
        />
      </span>

      <span
        class="absolute inset-0"
        style="transform: rotateY(calc(6 * 45deg)) translateZ(400px)"
      >
        <img
          src="https://picsum.photos/id/160/300/200"
          class="absolute inset-0 h-full w-full rounded-xl object-cover"
        />
      </span>

      <span
        class="absolute inset-0"
        style="transform: rotateY(calc(7 * 45deg)) translateZ(400px)"
      >
        <img
          src="https://picsum.photos/id/370/300/200"
          class="absolute inset-0 h-full w-full rounded-xl object-cover"
        />
      </span>

      <span
        class="absolute inset-0"
        style="transform: rotateY(calc(8 * 45deg)) translateZ(400px)"
      >
        <img
          src="https://picsum.photos/id/478/300/200"
          class="absolute inset-0 h-full w-full rounded-xl object-cover"
        />
      </span>
    </div>

    <!-- Buttons -->
    <div class="relative w-[80%]">
      <button
        id="prev"
        class="absolute bottom-[-180px] left-[20%] cursor-pointer rounded-md bg-slate-600 px-5 py-2 text-white transition hover:brightness-150"
      >
        Previous
      </button>

      <button
        id="next"
        class="absolute bottom-[-180px] right-[20%] cursor-pointer rounded-md bg-slate-600 px-5 py-2 text-white transition hover:brightness-150"
      >
        Next
      </button>
    </div>

    <script>
      const gallery = document.getElementById("gallery");

      const prev = document.getElementById("prev");
      const next = document.getElementById("next");

      let x = 0;
      let timer;

      prev.addEventListener("click", () => {
        x += 45;
        clearTimeout(timer);
        updateGallery();
      });

      next.addEventListener("click", () => {
        x -= 45;
        clearTimeout(timer);
        updateGallery();
      });

      function updateGallery() {
        gallery.style.transform = `perspective(1000px) rotateY(${x}deg)`;

        timer = setTimeout(() => {
          x -= 45;
          updateGallery();
        }, 3000);
      }

      updateGallery();
    </script>
  </body>
</html>
