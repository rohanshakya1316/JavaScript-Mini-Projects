<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Trailer Popup</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="m-0 font-sans flex justify-center h-screen items-center bg-black"
  >
    <div class="max-w-[550px] p-3 main-container">
      <img
        src="https://images.pexels.com/photos/3062545/pexels-photo-3062545.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=750&w=1260"
        alt="movie-image"
        class="max-w-full mb-[15px] rounded-[10px]"
      />

      <h1 class="text-white my-[15px]">Movie Title</h1>

      <p class="text-[gray]">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolor nulla
        quis natus quaerat est eius eaque, maxime velit magnam, optio
        voluptatum? Officia cupiditate veniam ipsum sequi ratione eius commodi
        quasi?
      </p>

      <button
        class="bg-white border-none px-5 py-2 cursor-pointer rounded-md hover:bg-[orange] btn"
      >
        Watch Now
      </button>
    </div>

    <div
      class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black w-full h-full flex justify-center items-center opacity-100 transition-opacity duration-700 [&.active]:invisible [&.active]:opacity-0 trailer-container active"
    >
      <video
        src="trailer.mp4"
        controls="true"
        class="relative max-w-[900px] outline-none lg:max-w-9/10"
      ></video>
      <i
        class="fas fa-times fa-2x absolute top-7 right-7 text-white cursor-pointer close-icon"
      ></i>
    </div>

    <script src="index.js"></script>
  </body>
</html>
