<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <title>Tip Calculator</title>
  </head>
  <body class="bg-[aquamarine] font-[Courier]">
    <div class="container bg-white max-w-[600px] mx-auto my-24 p-6 shadow-[0_0_10px_rgba(0,0,0,0.2)] border rounded-lg">

      <h1 class="mt-0 mb-4 text-center font-bold text-3xl">Tip Calculator</h1>

      <p class="capitalize pb-3 text-xl leading-6 font-semibold">Enter the bill amount & tip percentage to calculate total:</p>

      <label for="bill">Bill Amount:</label>
      <input type="number" id="bill" class="p-2 border border-gray-300 rounded-md mx-0 my-3 w-full"/>
      <br />

      <label for="tip">Tip Percentage:</label>
      <input type="number" id="tip" class="p-2 border border-gray-300 rounded-md mx-0 my-3 w-full"/>
      <br />

      <button id="calculate" class="uppercase bg-[rgb(33,34,34)] text-white p-2 rounded-lg mx-0 my-3 w-full text-xl transition background-color duration-300 ease hover:bg-[#87d88b]">Calculate</button>
      <br />

      <label for="total">Total:</label>
      <span id="total" class="text-2xl font-bold mt-3"></span>
    </div>

    <script src="index.js"></script>
  </body>
</html>
