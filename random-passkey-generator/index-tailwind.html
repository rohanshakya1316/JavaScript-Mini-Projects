<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <title>Random Passkey Generator</title>
  </head>
  <body class="flex justify-center items-center h-screen font-[Courier]">
    <div class="bg-slate-400 w-[500px] p-6 rounded-[10px] m-4 shadow-[0_4px_8px_rgba(0,0,0,0.3)] password-container">
      <h2 class="p-4 text-2xl font-bold ">Random Password Generator</h2>
      <div class="p-3 rounded-[10px] border border-2 border-black flex justify-between items-center input-container">
        <input
          type="text"
          name="input"
          id="input"
          class="border-none bg-transparent outline-none text-xl placeholder:text-indigo-500 placeholder:font-semibold input"
          placeholder="Create Password"
          readonly
        />
        <i class="far fa-copy fa-2x cursor-pointer opacity-30 hover:opacity-70"></i>
      </div>
      <button class="btn bg-black text-blue-500 px-[20px] py-[10px] rounded-[5px] my-[10px] text-xl cursor-pointer hover:bg-green-400 hover:text-slate-500 active:scale-95">Generate</button>
    </div>
    <div class="alert-container fixed w-[300px] h-[50px] bg-green-500 right-[20px] bottom-[20px] rounded-[10px] shadow-[0_4px_8px_rgba(0,0,0,0.3)] flex justify-center items-center text-xl transition transform duration-400 -right-[300px]" active>Password Copied</div>
    <script src="index.js"></script>
  </body>
</html>
