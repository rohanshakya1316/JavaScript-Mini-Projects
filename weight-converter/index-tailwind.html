<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weight Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="index.js" defer></script>
  </head>

  <body
    class="m-0 min-h-screen flex justify-center items-center font-mono text-[darkcyan]
           bg-gradient-to-tl from-yellow-600 via-sky-200 to-yellow-400"
  >
    <div
      class="bg-white/30 p-5 rounded-xl shadow-[0_4px_10px_rgba(0,0,0,0.3)]
             w-full max-w-[450px]"
    >
      <h1 class="text-center mb-8 text-3xl font-bold">
        Weight Converter
      </h1>

      <div class="flex justify-between items-center text-lg font-bold">
        <label for="pounds">Pounds:</label>

        <input
          type="number"
          id="pounds"
          placeholder="Enter your weight in pounds:"
          class="p-3 w-3/4 bg-white/30 border border-white/40 rounded-md
                 text-green-800 text-sm outline-none"
        />
      </div>

      <p class="mt-8 text-lg">
        Your weight in kg is:
        <span id="result"></span>
      </p>

      <p id="error" class="text-red-500 mt-2"></p>
    </div>
  </body>
</html>
