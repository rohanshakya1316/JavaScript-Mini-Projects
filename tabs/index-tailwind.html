<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <title>Tabs Project</title>
  </head>
  <body class="m-0 p-0 bg-green-500 text-yellow-950 font-mono">

    <div
      class="w-[90vw] max-w-6xl mx-auto py-20 lg:grid lg:grid-cols-2 lg:gap-8"
    >
      
      <!-- Image -->
      <div class="mb-8 lg:mb-0">
        <img
          src="leaf.jpg"
          alt="Leaf Photo"
          class="block w-full h-[30rem] object-cover rounded-lg"
        />
      </div>

      <!-- Tabs -->
      <div class="tabs bg-rose-100 rounded-lg overflow-hidden">

        <!-- Buttons -->
        <div class="grid grid-cols-3">

          <button
            data-id="step1"
            class="button live bg-rose-100 px-4 py-4 text-base tracking-[0.25rem] cursor-pointer transition hover:bg-indigo-500 hover:text-white"
          >
            Step 1
          </button>

          <button
            data-id="step2"
            class="button bg-blue-200 px-4 py-4 text-base tracking-[0.25rem] cursor-pointer transition hover:bg-indigo-500 hover:text-white"
          >
            Step 2
          </button>

          <button
            data-id="step3"
            class="button bg-blue-200 px-4 py-4 text-base tracking-[0.25rem] cursor-pointer transition hover:bg-indigo-500 hover:text-white"
          >
            Step 3
          </button>

        </div>

        <!-- Content -->
        <div class="p-8">

          <div id="step1" class="content live block">
            <h3 class="text-xl font-bold mb-4">Step 1</h3>
            <p>
              Lorem ipsum dolor sit amet consectetur adipisicing elit.
            </p>
          </div>

          <div id="step2" class="content hidden">
            <h3 class="text-xl font-bold mb-4">Step 2</h3>
            <p>
              Lorem ipsum dolor sit amet consectetur adipisicing elit.
            </p>
          </div>

          <div id="step3" class="content hidden">
            <h3 class="text-xl font-bold mb-4">Step 3</h3>
            <p>
              Lorem ipsum dolor sit amet consectetur adipisicing elit.
            </p>
          </div>

        </div>
      </div>
    </div>

    <script src="index-tailwind.js"></script>
  </body>
</html>
