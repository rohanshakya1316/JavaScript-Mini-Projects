<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Photos</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style type="text/tailwindcss">
      .image-container img {
        @apply m-[10px] w-[300px] h-[300px] rounded-[10px]
               shadow-[0_4px_8px_rgba(0,0,0,0.3)]
               bg-gray-300 inline-block;
      }
    </style>
  </head>

  <body class="m-0 flex flex-col items-center bg-[brown]">
    <div class="image-container text-center">
      <img src="https://picsum.photos/300?random=1" />
      <img src="https://picsum.photos/300?random=2" />
      <img src="https://picsum.photos/300?random=3" />
      <img src="https://picsum.photos/300?random=4" />
      <img src="https://picsum.photos/300?random=5" />
      <img src="https://picsum.photos/300?random=6" />
    </div>

    <button
      class="btn bg-[slateblue] border-none px-[20px] py-[10px] m-[20px] text-white rounded-[5px] shadow-[0_4px_8px_rgba(0,0,0,0.3)] cursor-pointer hover:opacity-90"
    >
      Load More
    </button>

    <script src="index.js"></script>
  </body>
</html>
